<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#334155; stroke-width:1.5; rx:8; }
      .web { fill:#eef2ff; stroke:#6366f1; }
      .cap { fill:#ecfeff; stroke:#0891b2; }
      .and { fill:#f0fdf4; stroke:#16a34a; }
      .ios { fill:#fff1f2; stroke:#e11d48; }
      .lbl { fill:#0f172a; font-weight:600; }
      .sub { fill:#475569; font-size:11px; }
      .ttl { fill:#0f172a; font-size:16px; font-weight:700; }
      .edge { stroke:#334155; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <text x="20" y="28" class="ttl">Capacitor Wrapper — Build &amp; Runtime Flow</text>

  <!-- Stage A: root site -->
  <rect x="20" y="70" width="170" height="70" rx="8" class="box web"/>
  <text x="105" y="98" text-anchor="middle" class="lbl">Root static site</text>
  <text x="105" y="116" text-anchor="middle" class="sub">index.html, *.js, style.css</text>

  <!-- Stage B: www -->
  <rect x="250" y="70" width="170" height="70" rx="8" class="box cap"/>
  <text x="335" y="98" text-anchor="middle" class="lbl">www/ bundle</text>
  <text x="335" y="116" text-anchor="middle" class="sub">npm run build (copy-web.js)</text>

  <!-- Stage C: sync -->
  <rect x="480" y="70" width="170" height="70" rx="8" class="box cap"/>
  <text x="565" y="98" text-anchor="middle" class="lbl">npx cap sync</text>
  <text x="565" y="116" text-anchor="middle" class="sub">copies www/ into native assets</text>

  <!-- Android branch -->
  <rect x="480" y="190" width="190" height="80" rx="8" class="box and"/>
  <text x="575" y="216" text-anchor="middle" class="lbl">Android assets/public</text>
  <text x="575" y="234" text-anchor="middle" class="sub">CapacitorActivity</text>
  <text x="575" y="252" text-anchor="middle" class="sub">+ Android WebView</text>

  <rect x="480" y="320" width="190" height="60" rx="8" class="box and"/>
  <text x="575" y="346" text-anchor="middle" class="lbl">Gradle build</text>
  <text x="575" y="364" text-anchor="middle" class="sub">APK / AAB</text>

  <!-- iOS branch -->
  <rect x="710" y="190" width="170" height="80" rx="8" class="box ios"/>
  <text x="795" y="216" text-anchor="middle" class="lbl">iOS App/public</text>
  <text x="795" y="234" text-anchor="middle" class="sub">CAPBridgeViewController</text>
  <text x="795" y="252" text-anchor="middle" class="sub">+ WKWebView</text>

  <rect x="710" y="320" width="170" height="60" rx="8" class="box ios"/>
  <text x="795" y="346" text-anchor="middle" class="lbl">Xcode build</text>
  <text x="795" y="364" text-anchor="middle" class="sub">IPA / App Store</text>

  <!-- edges -->
  <line x1="190" y1="105" x2="248" y2="105" class="edge" marker-end="url(#arrow)"/>
  <line x1="420" y1="105" x2="478" y2="105" class="edge" marker-end="url(#arrow)"/>
  <path d="M565,140 L565,188" class="edge" marker-end="url(#arrow)"/>
  <path d="M670,140 C700,140 700,188 700,188" class="edge" marker-end="url(#arrow)"/>
  <line x1="575" y1="270" x2="575" y2="318" class="edge" marker-end="url(#arrow)"/>
  <line x1="795" y1="270" x2="795" y2="318" class="edge" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="20" y="360" width="12" height="12" class="box web"/><text x="38" y="371" class="sub">Web</text>
  <rect x="100" y="360" width="12" height="12" class="box cap"/><text x="118" y="371" class="sub">Capacitor</text>
  <rect x="190" y="360" width="12" height="12" class="box and"/><text x="208" y="371" class="sub">Android</text>
  <rect x="290" y="360" width="12" height="12" class="box ios"/><text x="308" y="371" class="sub">iOS</text>
</svg>
